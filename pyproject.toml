[project]
name = "digitalheat"
version = "0.1.0"
description = "Heat-aware scheduler and yearly balance for heat-reuse AI servers (sprintd Basel 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "requests",
    "fastapi",
    "uvicorn",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]  # httpx: FastAPI TestClient
jobs = ["faster-whisper", "sentence-transformers"]  # heavy: install only when needed
dashboard = ["fastapi", "uvicorn", "jinja2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
